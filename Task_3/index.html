<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 3 Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/405c5b8645.js" crossorigin="anonymous"></script>

</head>

<body class="bg-info-subtle">
    <div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card border-primary shadow-sm w-50">
            <form class="inline-form p-4">
                <h1 class="text-center card-title p-3">Date Validator Test Client</h1>
                <div class="d-inline-flex col-md-12 mb-4">
                    <label class="col-form-label col-md-2 col-sm-3 col-3 text-end me-3 " for="date">Date: </label>
                    <input class="form-control col" id="date" placeholder="Date">
                    <label class="text-muted col-form-label p-1">e.g. 08/01/2025</label>
                </div>
                <div class="d-inline-flex col-md-12 mb-4">
                    <label class="col-form-label col-md-2 col-sm-3 col-3 text-end me-3 " for="date_format">Format: </label>
                    <input class="form-control col" id="date_format" placeholder="Date Format">
                    <label class="text-muted col-form-label p-1">e.g. DD/MM/YY</label>
                </div>
                <p class="text-center m-4" id="validate_output"></p>
                <div class="form-group row col-md-offset-2 mt-4 justify-content-center ">
                    <button class="btn btn-primary  w-50 col-md-1 me-1 mb-1 rounded-5" id="validate" type="submit">Validate</button>
                </div>
            </form>
        </div>
    </div>

    <script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js " integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js " integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>

</body>

</html>
